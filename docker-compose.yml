services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: file:/data/dev.db
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - backend-data:/data

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_GRAPHQL_URL: http://localhost:3001/graphql
        NEXT_PUBLIC_GRAPHQL_WS_URL: ws://localhost:3001/graphql
    environment:
      NEXT_PUBLIC_GRAPHQL_URL: http://localhost:3001/graphql
      NEXT_PUBLIC_GRAPHQL_WS_URL: ws://localhost:3001/graphql
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  backend-data:
